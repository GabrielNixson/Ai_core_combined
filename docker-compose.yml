# Monolithic Compose Disabled
#
# Instead of a monolithic service launcher, this project has been split into 
# completely decoupled, self-contained microservice stacks:
#
# 1. Ingestion Backend & Databases:
#    - Folder: ./document_parsing_backend/
#    - Start Command: cd document_parsing_backend && docker compose up --build -d
#
# 2. Chat Backend:
#    - Folder: ./LangGraph_backend/
#    - Start Command: cd LangGraph_backend && docker compose up --build -d
#
# 3. Client Frontend:
#    - Folder: ./Plixy_frontend/
#    - Start Command: cd Plixy_frontend && docker compose up --build -d
#
# All database dependencies and port configurations are fully contained within 
# their respective directories.
