version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://192.168.2.213:5100}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://192.168.2.213:5100}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://192.168.2.213:5100}
    image: plixy-frontend:latest
    ports:
      - "5003:80"
